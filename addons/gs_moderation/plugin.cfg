[plugin]

name="gs-moderation"
description="Bans, kicks, chat gags and voice mutes as one durable record. Pluggable storage so a community running several servers shares one list, expiry checked on read, immunity between staff, and a moderation history per player. Publishes a mute source gs-voice and gs-server both consult."
author="dot"
version="0.1.0"
script="gs_moderation_plugin.gd"
